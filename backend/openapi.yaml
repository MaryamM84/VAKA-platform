openapi: 3.0.3
info:
  title: VAKA Platform API
  version: 1.0.0
  description: API documentation for the VAKA platform. Task creation and listing
    require an authenticated user with the EMPLOYER role.
paths:
  /api/admin/worker-verifications/:
    get:
      operationId: admin_worker_verifications_list
      summary: List pending worker verification applications
      tags:
      - Admin Worker Verification
      security:
      - jwtAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminWorkerVerificationList'
          description: ''
  /api/admin/worker-verifications/{executor_profile_id}/:
    get:
      operationId: admin_worker_verifications_retrieve
      summary: Get worker verification application details
      parameters:
      - in: path
        name: executor_profile_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Admin Worker Verification
      security:
      - jwtAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminWorkerVerificationDetail'
          description: ''
        '404':
          description: Application not found.
  /api/admin/worker-verifications/{executor_profile_id}/approve/:
    post:
      operationId: admin_worker_verifications_approve_create
      summary: Approve worker verification application
      parameters:
      - in: path
        name: executor_profile_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Admin Worker Verification
      security:
      - jwtAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminWorkerVerificationDetail'
          description: ''
        '400':
          description: Application is not pending.
        '404':
          description: Application not found.
  /api/admin/worker-verifications/{executor_profile_id}/documents/{document_id}/download/:
    get:
      operationId: admin_worker_verifications_documents_download_retrieve
      summary: Download a private verification document
      parameters:
      - in: path
        name: document_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: executor_profile_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Admin Worker Verification
      security:
      - jwtAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          description: Private verification document.
        '404':
          description: Document not found.
  /api/admin/worker-verifications/{executor_profile_id}/reject/:
    post:
      operationId: admin_worker_verifications_reject_create
      summary: Reject worker verification application
      parameters:
      - in: path
        name: executor_profile_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Admin Worker Verification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerVerificationRejectRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WorkerVerificationRejectRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WorkerVerificationRejectRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminWorkerVerificationDetail'
          description: ''
        '400':
          description: Invalid rejection reason or application status.
        '404':
          description: Application not found.
  /api/auth/login/otp/send/:
    post:
      operationId: auth_login_otp_send_create
      summary: Request login OTP
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPPhoneRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OTPPhoneRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OTPPhoneRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTPPhone'
          description: ''
  /api/auth/login/otp/verify/:
    post:
      operationId: auth_login_otp_verify_create
      summary: Login using OTP
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OTPVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OTPVerifyRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/auth/login/password/:
    post:
      operationId: auth_login_password_create
      summary: Login with phone and password
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordLoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
        '401':
          description: Invalid phone number or password.
  /api/auth/otp/resend/:
    post:
      operationId: auth_otp_resend_create
      summary: Resend OTP
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPResendRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OTPResendRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OTPResendRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTPResend'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      summary: Register and request phone verification OTP
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTPPendingResponse'
          description: ''
  /api/auth/register/verify-otp/:
    post:
      operationId: auth_register_verify_otp_create
      summary: Verify registration OTP
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OTPVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OTPVerifyRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      summary: Refresh JWT access token
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
          description: ''
  /api/auth/token/verify/:
    post:
      operationId: auth_token_verify_create
      description: |-
        Takes a token and indicates if it is valid.  This view provides no
        information about a token's fitness for a particular use.
      summary: Verify JWT token
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: Token is valid.
        '401':
          description: Token is invalid or expired.
  /api/offers/bids/:
    get:
      operationId: my_bids_list
      description: Returns all bids submitted by the authenticated executor.
      summary: Get my bids
      tags:
      - Bidding
      security:
      - jwtAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BidRead'
          description: ''
    post:
      operationId: submit_bid
      description: Allows an authenticated, approved and active executor to submit
        one bid for an open task.
      summary: Submit a bid
      tags:
      - Bidding
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BidSubmissionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BidSubmissionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BidSubmissionRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BidRead'
          description: ''
  /api/offers/bids/{bid_id}/:
    get:
      operationId: my_bid_detail
      description: Returns details of a bid belonging to the authenticated executor.
      summary: Get my bid details
      parameters:
      - in: path
        name: bid_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Bidding
      security:
      - jwtAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BidRead'
          description: ''
    patch:
      operationId: update_my_bid
      description: Updates an active bid before the task is assigned.
      summary: Update my bid
      parameters:
      - in: path
        name: bid_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Bidding
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBidUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBidUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBidUpdateRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BidRead'
          description: ''
  /api/offers/employer/bids/:
    get:
      operationId: employer_bids_list
      description: Returns all bids submitted to tasks owned by the authenticated
        employer.
      summary: List employer received bids
      tags:
      - Employer Bidding
      security:
      - jwtAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmployerBidList'
          description: ''
  /api/offers/employer/bids/{bid_id}/:
    get:
      operationId: employer_bid_detail
      description: Returns bid details only if the related task belongs to the authenticated
        employer.
      summary: Get employer bid details
      parameters:
      - in: path
        name: bid_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Employer Bidding
      security:
      - jwtAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployerBidDetail'
          description: ''
  /api/offers/employer/tasks/{task_id}/bids/:
    get:
      operationId: employer_task_bids_list
      description: Returns all bids for a task owned by the authenticated employer.
      summary: List bids for employer task
      parameters:
      - in: path
        name: task_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Employer Bidding
      security:
      - jwtAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmployerBidList'
          description: ''
  /api/profile/me/:
    get:
      operationId: profile_me_retrieve
      description: Returns the personal information and optional worker profile information
        of the authenticated user.
      summary: Get current user's profile
      tags:
      - Profile
      security:
      - jwtAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyProfile'
          description: ''
        '401':
          description: Authentication credentials were not provided.
    patch:
      operationId: profile_me_partial_update
      summary: Update current user's profile
      tags:
      - Profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMyProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMyProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMyProfileRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyProfile'
          description: ''
        '400':
          description: Invalid profile information.
        '401':
          description: Authentication credentials were not provided.
  /api/profile/me/availability/:
    get:
      operationId: profile_me_availability_retrieve
      summary: Get current worker availability
      tags:
      - Worker Preferences
      security:
      - jwtAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerAvailabilityCollection'
          description: ''
    post:
      operationId: profile_me_availability_create
      summary: Add an availability slot
      tags:
      - Worker Preferences
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerAvailabilityWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WorkerAvailabilityWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WorkerAvailabilityWriteRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerAvailabilityRead'
          description: ''
        '400':
          description: Invalid or overlapping availability slot.
        '401':
          description: Authentication required.
    patch:
      operationId: profile_me_availability_partial_update
      summary: Update worker availability timezone
      tags:
      - Worker Preferences
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedWorkerAvailabilityTimezoneRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedWorkerAvailabilityTimezoneRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedWorkerAvailabilityTimezoneRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerAvailabilityCollection'
          description: ''
        '400':
          description: Invalid timezone.
  /api/profile/me/availability/{availability_id}/:
    patch:
      operationId: profile_me_availability_partial_update_2
      summary: Update an availability slot
      parameters:
      - in: path
        name: availability_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Worker Preferences
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedWorkerAvailabilityWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedWorkerAvailabilityWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedWorkerAvailabilityWriteRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerAvailabilityRead'
          description: ''
        '400':
          description: Invalid or overlapping availability slot.
        '404':
          description: Availability slot not found.
    delete:
      operationId: profile_me_availability_destroy
      summary: Delete an availability slot
      parameters:
      - in: path
        name: availability_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Worker Preferences
      security:
      - jwtAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '204':
          description: Availability slot deleted successfully.
        '404':
          description: Availability slot not found.
  /api/profile/me/preferences/:
    get:
      operationId: profile_me_preferences_retrieve
      summary: Get current worker preferences
      tags:
      - Worker Preferences
      security:
      - jwtAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerPreferencesRead'
          description: ''
        '401':
          description: Authentication required.
    patch:
      operationId: profile_me_preferences_partial_update
      summary: Update current worker preferences
      tags:
      - Worker Preferences
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedWorkerPreferencesUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedWorkerPreferencesUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedWorkerPreferencesUpdateRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerPreferencesRead'
          description: ''
        '400':
          description: Invalid preference information.
        '401':
          description: Authentication required.
  /api/profile/me/service-area/:
    get:
      operationId: profile_me_service_area_retrieve
      summary: Get current worker service area
      tags:
      - Worker Preferences
      security:
      - jwtAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerServiceArea'
          description: ''
    patch:
      operationId: profile_me_service_area_partial_update
      summary: Update current worker service area
      tags:
      - Worker Preferences
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedWorkerServiceAreaRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedWorkerServiceAreaRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedWorkerServiceAreaRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerServiceArea'
          description: ''
        '400':
          description: Invalid service area information.
        '401':
          description: Authentication required.
  /api/profile/me/skills/:
    get:
      operationId: profile_me_skills_list
      summary: Get current user's skills
      tags:
      - Worker Skills
      security:
      - jwtAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkerSkillRead'
          description: ''
    post:
      operationId: profile_me_skills_create
      summary: Add a skill to current user's profile
      tags:
      - Worker Skills
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerSkillCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WorkerSkillCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WorkerSkillCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerSkillRead'
          description: ''
        '400':
          description: Invalid skill or duplicate skill.
        '401':
          description: Authentication required.
  /api/profile/me/skills/{worker_skill_id}/:
    patch:
      operationId: profile_me_skills_partial_update
      summary: Update current user's skill
      parameters:
      - in: path
        name: worker_skill_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Worker Skills
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedWorkerSkillUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedWorkerSkillUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedWorkerSkillUpdateRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerSkillRead'
          description: ''
        '400':
          description: Invalid skill information.
        '404':
          description: Skill not found.
    delete:
      operationId: profile_me_skills_destroy
      summary: Delete current user's skill
      parameters:
      - in: path
        name: worker_skill_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Worker Skills
      security:
      - jwtAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '204':
          description: Skill successfully deleted.
        '404':
          description: Skill not found.
  /api/profile/me/verification/:
    get:
      operationId: profile_me_verification_retrieve
      summary: Get current worker verification status
      tags:
      - Worker Verification
      security:
      - jwtAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerVerificationStatus'
          description: ''
        '401':
          description: Authentication required.
  /api/profile/me/verification/documents/:
    post:
      operationId: profile_me_verification_documents_create
      description: Upload a private identity verification document for the authenticated
        user's executor profile.
      summary: Upload worker verification document
      tags:
      - Worker Verification
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WorkerVerificationDocumentUploadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WorkerVerificationDocumentUploadRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerVerificationDocumentRead'
          description: ''
        '400':
          description: Invalid document or verification status.
        '401':
          description: Authentication required.
  /api/profile/me/verification/submit/:
    post:
      operationId: profile_me_verification_submit_create
      summary: Submit worker verification application
      tags:
      - Worker Verification
      security:
      - jwtAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerVerificationStatus'
          description: ''
        '400':
          description: Application cannot be submitted.
        '401':
          description: Authentication required.
  /api/skills/:
    get:
      operationId: skills_list
      description: Returns skills belonging to active categories and global skills.
        Optionally filter by category_id. Global skills (category=null) remain available
        when a category filter is supplied.
      summary: List skills
      parameters:
      - in: query
        name: category_id
        schema:
          type: string
          format: uuid
        description: Optional category UUID used to filter skills.
      tags:
      - Task Catalog
      security:
      - jwtAuth: []
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Skill'
          description: ''
  /api/task-categories/:
    get:
      operationId: task_categories_list
      description: Returns active task categories, including their parent category
        when present.
      summary: List active task categories
      tags:
      - Task Catalog
      security:
      - jwtAuth: []
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskCategory'
          description: ''
  /api/tasks/:
    get:
      operationId: tasks_list
      description: Returns all tasks created by the current authenticated user. Tasks
        belonging to other users are never included.
      summary: List tasks created by the authenticated employer
      tags:
      - Tasks
      security:
      - jwtAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskRead'
          description: ''
    post:
      operationId: tasks_create
      description: Creates a task in DRAFT status. The employer and initial status
        are assigned by the server and cannot be supplied by the client.
      summary: Create a task draft
      tags:
      - Tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCreate'
          description: ''
  /api/tasks/{task_id}/publish/:
    post:
      operationId: task_publish
      description: Publishes a valid task draft owned by the authenticated employer.
        The task transitions from DRAFT to OPEN. The server sets published_at and
        records the status history.
      summary: Publish a task draft
      parameters:
      - in: path
        name: task_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Tasks
      security:
      - jwtAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRead'
          description: ''
